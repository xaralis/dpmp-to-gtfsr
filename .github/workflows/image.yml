name: Image

# Publishes the service image to GHCR so hosts pull it instead of building on the box.
# Tags: sha-<short> (immutable, what deployments pin) and latest.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same seven characters as the sha- tag, so an error report names the
      # image that sent it.
      - id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SENTRY_RELEASE=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
