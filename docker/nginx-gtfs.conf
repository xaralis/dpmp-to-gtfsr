# nginx server block for gtfs.varecha.work, to be mounted into the nginx that
# already runs on the box (the one serving orchestrator.varecha.work).
#
# The domain is written out rather than templated: the host's nginx only
# substitutes ${DOMAIN}, and adding a second variable would mean editing its
# NGINX_ENVSUBST_TEMPLATE_VARS too. One literal name is the smaller change.
#
# Mount as:
#   ./nginx/gtfs.conf:/etc/nginx/conf.d/gtfs.conf:ro
#
# It lands in conf.d directly, so the entrypoint's template expansion leaves
# it alone.

server {
    listen 80;
    server_name gtfs.varecha.work;

    # Shares the existing certbot webroot volume, so renewals for this name
    # work through the same loop as the other site.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gtfs.varecha.work;

    # Resolve the upstream at request time rather than at startup: the feed
    # container may be restarted or recreated independently, and a name
    # resolved once at boot would keep pointing at a dead address.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $feed_upstream http://dpmp-gtfs:8000;

    ssl_certificate     /etc/letsencrypt/live/gtfs.varecha.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtfs.varecha.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # The static feed is ~1.7 MB and the realtime one is protobuf; both
    # already carry their own Cache-Control from the app, so nothing here
    # overrides caching.
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass         $feed_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A full static rebuild can hold the event loop briefly; the default
        # 60s read timeout is plenty, but be explicit about it.
        proxy_read_timeout 60s;
    }
}
