# Run from the repo root so one .env serves every entry point:
#   docker compose --env-file .env -f docker/compose.yaml up -d
# Without --env-file, compose would look for docker/.env instead, while
# `dpmp-gtfs serve` reads .env from the working directory -- two files with
# the same name in different places is a good way to debug the wrong one.

services:
  feed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dpmp-to-gtfsr:latest
    restart: unless-stopped
    # Loopback by default: on a host with a reverse proxy the port has no
    # business being reachable from outside, and on a host without one the
    # proxy is the thing to add, not an open port. Override with FEED_BIND
    # when a different address or port is needed.
    ports:
      - "${FEED_BIND:-127.0.0.1:8000}:8000"
    environment:
      # The public web app ships this key in its JS bundle, so it is not a
      # secret -- but it stays out of the image so rotating it is a restart,
      # not a rebuild.
      DPMP_API_KEY: ${DPMP_API_KEY:?set DPMP_API_KEY in .env}
      DPMP_DATA_DIR: /data
      # On the volume, not in the image: the CIS archives are ~300 MB and are
      # re-fetched conditionally, so losing them on a restart costs a full
      # download for a registry that has not changed.
      DPMP_CIS_DIR: /data/cis
      # Needed for absolute URLs in social preview tags. Optional: left unset,
      # those tags are omitted rather than pointing somewhere unreachable.
      DPMP_PUBLIC_URL: ${DPMP_PUBLIC_URL:-}
    volumes:
      - feed-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  feed-data:
