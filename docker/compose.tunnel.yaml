# Deployment through a Cloudflare Tunnel.
#
# For putting this on a host that already runs something else. The tunnel
# dials *out* to Cloudflare, so this stack:
#
#   * publishes no ports and needs none free,
#   * shares no network, nginx, or certificate with anything already there,
#   * needs no DNS record, no certbot, and no inbound firewall rule.
#
# Nothing else on the host is touched or even aware of it, which is the whole
# point: a reverse proxy already terminating TLS for another service would
# have meant editing that service's compose file and dropping a config into
# its directory, coupling two projects that have no reason to know about each
# other.
#
# Setup is in deploy-tunnel.md; it comes down to pasting one token.

services:
  feed:
    image: ${FEED_IMAGE:-dpmp-to-gtfsr:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Requests arrive from the tunnel container, not from localhost, so
    # uvicorn's default forwarded-header allowlist would drop
    # X-Forwarded-Proto and see every request as plain HTTP. Trusting any
    # source is safe here precisely because the port is never published: the
    # tunnel is the only thing that can reach it.
    command:
      - uvicorn
      - dpmp_gtfs.web.app:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      DPMP_DATA_DIR: /data
      # On the volume, not in the image: the CIS archives are ~300 MB and are
      # re-fetched conditionally, so losing them on a restart costs a full
      # download for a registry that has not changed.
      DPMP_CIS_DIR: /data/cis
      # Needed for absolute URLs in social preview tags. Optional: left unset,
      # those tags are omitted rather than pointing somewhere unreachable.
      DPMP_PUBLIC_URL: ${DPMP_PUBLIC_URL:-}
    volumes:
      - feed-data:/data
    # Reachable only from the tunnel, never from the host's network.
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: --no-autoupdate --config /etc/cloudflared/config.yml tunnel run
    volumes:
      # Generated from config.template.yml by `make tunnel-config` (or the sed
      # in deploy-tunnel.md). Substitution happens on the host because the
      # cloudflared image is distroless -- it has no shell to do it itself.
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Written by `cloudflared tunnel create`. Read-only, never in git.
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - feed
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  feed-data:
