[project]
name = "dpmp-to-gtfsr"
version = "0.1.0"
description = "GTFS and GTFS-Realtime feed provider for Pardubice public transport (DPMP)"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
authors = [{ name = "xaralis" }]

dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    "jinja2>=3.1",
    "gtfs-realtime-bindings>=2.2",
    "typer>=0.19",
]

[project.scripts]
dpmp-gtfs = "dpmp_gtfs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-protobuf>=7.34.1.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dpmp_gtfs"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in defaults is the framework's idiom, not a mutable default.
"src/dpmp_gtfs/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
packages = ["dpmp_gtfs"]
strict = true
